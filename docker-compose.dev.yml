version: '3.8'

services:
  chainforge-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"  # React dev server
      - "8000:8000"  # Python backend
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true  # Enable polling for file watching in Docker
    volumes:
      # Mount source code for hot-reloading
      - ./chainforge/react-server:/app
      - ./chainforge:/chainforge/chainforge
      # Exclude node_modules from mounting (use container's version)
      - /app/node_modules
    stdin_open: true
    tty: true
    command: npm start
