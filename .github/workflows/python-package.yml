name: Validate Install

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10.11", 3.11, 3.12, 3.13, 3.14]
      fail-fast: false

    steps:
    - name: Check out the repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('chainforge/requirements.txt', 'chainforge/constraints.txt', 'setup.py') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-

    - name: Upgrade pip
      run: python -m pip install --upgrade pip

    - name: Install package
      run: |
        pip install -e .
    
    - name: Install with RAG extras
      run: |
        pip install -e .[rag]

    - name: Install pytest
      run: |
        pip install pytest

    # The RAG tests download sentence-transformers / model2vec models from the
    # HuggingFace Hub. Cache them so that every matrix entry doesn't re-fetch
    # a few hundred MB on each run.
    - name: Cache HuggingFace models
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        key: ${{ runner.os }}-hf-${{ hashFiles('tests/*.py') }}
        restore-keys: |
          ${{ runner.os }}-hf-

    # TODO: Check that the server runs

    - name: Run tests
      env:
        HF_HUB_DISABLE_TELEMETRY: "1"
        # Tests needing a provider API key skip themselves when it is unset,
        # so this job stays green (and free) without secrets.
      run: pytest -v
