name: Build Docker Images

on:
  pull_request:
    branches:
      - main
      - master
      - ragforge
  push:
    branches:
      - main
      - master
      - ragforge
    tags:
      - 'v*'

# # Concurrency: cancel in-progress runs when new one starts
# concurrency:
#   group: ${{ github.workflow }}-${{ github.ref }}
#   cancel-in-progress: true

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/chainforge

jobs:
  build-cpu-amd64:
    name: Build CPU AMD64 Image
    runs-on: ubuntu-latest
    # Skip if commit message contains [skip ci] or [ci skip]
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]') }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,suffix=-amd64
            type=ref,event=pr,suffix=-amd64
            type=semver,pattern={{version}},suffix=-amd64
            type=semver,pattern={{major}}.{{minor}},suffix=-amd64
            type=raw,value=cpu-amd64

      - name: Build and push CPU AMD64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          provenance: false
          sbom: false

  build-cpu-arm64:
    name: Build CPU ARM64 Image
    runs-on: ubuntu-latest
    # Skip if commit message contains [skip ci] or [ci skip]
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]') }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,suffix=-arm64
            type=ref,event=pr,suffix=-arm64
            type=semver,pattern={{version}},suffix=-arm64
            type=semver,pattern={{major}}.{{minor}},suffix=-arm64
            type=raw,value=cpu-arm64

      - name: Build and push CPU ARM64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/arm64
          provenance: false
          sbom: false

  build-gpu-amd64:
    name: Build GPU AMD64 Image
    runs-on: ubuntu-latest
    # Skip if commit message contains [skip ci] or [ci skip]
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]') }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,suffix=-gpu-amd64
            type=ref,event=pr,suffix=-gpu-amd64
            type=semver,pattern={{version}},suffix=-gpu-amd64
            type=semver,pattern={{major}}.{{minor}},suffix=-gpu-amd64
            type=raw,value=gpu-amd64

      - name: Build and push GPU AMD64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.gpu
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          provenance: false
          sbom: false


  create-cpu-manifest:
    name: Create CPU Multi-Arch Manifest
    runs-on: ubuntu-latest
    needs: [build-cpu-amd64, build-cpu-arm64]
    if: ${{ github.event_name != 'pull_request' && !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]') }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create and push CPU manifest
        run: |
          # Determine tags based on ref
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            MAJOR_MINOR=$(echo $VERSION | cut -d. -f1,2)
            docker buildx imagetools create -t ${{ env.IMAGE_NAME }}:${VERSION} \
              -t ${{ env.IMAGE_NAME }}:${MAJOR_MINOR} \
              -t ${{ env.IMAGE_NAME }}:cpu \
              -t ${{ env.IMAGE_NAME }}:latest \
              ${{ env.IMAGE_NAME }}:cpu-amd64 \
              ${{ env.IMAGE_NAME }}:cpu-arm64
          else
            BRANCH=${GITHUB_REF#refs/heads/}
            docker buildx imagetools create -t ${{ env.IMAGE_NAME }}:${BRANCH} \
              -t ${{ env.IMAGE_NAME }}:cpu \
              -t ${{ env.IMAGE_NAME }}:latest \
              ${{ env.IMAGE_NAME }}:cpu-amd64 \
              ${{ env.IMAGE_NAME }}:cpu-arm64
          fi

  create-gpu-manifest:
    name: Create GPU Manifest
    runs-on: ubuntu-latest
    needs: [build-gpu-amd64]
    if: ${{ github.event_name != 'pull_request' && !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]') }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create and push GPU manifest (AMD64 only)
        run: |
          # Determine tags based on ref
          # GPU images are AMD64 only due to storage constraints and limited ARM64 CUDA support
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            MAJOR_MINOR=$(echo $VERSION | cut -d. -f1,2)
            docker buildx imagetools create -t ${{ env.IMAGE_NAME }}:${VERSION}-gpu \
              -t ${{ env.IMAGE_NAME }}:${MAJOR_MINOR}-gpu \
              -t ${{ env.IMAGE_NAME }}:gpu \
              ${{ env.IMAGE_NAME }}:gpu-amd64
          else
            BRANCH=${GITHUB_REF#refs/heads/}
            docker buildx imagetools create -t ${{ env.IMAGE_NAME }}:${BRANCH}-gpu \
              -t ${{ env.IMAGE_NAME }}:gpu \
              ${{ env.IMAGE_NAME }}:gpu-amd64
          fi
